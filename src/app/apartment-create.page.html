<section class="page-header">
  <div>
    <h1 class="page-title">Add a new apartment</h1>
    <p class="page-subtitle">
      Store the place once and re‑use it when tracking monthly bills.
    </p>
  </div>
</section>

<section class="form-wrapper">
  <mat-card>
    <mat-card-content>
      <form
        class="apartment-form"
        (ngSubmit)="createApartment(nameInput, notesInput)"
      >
        <mat-form-field appearance="outline" class="apartment-form__field">
          <mat-label>Apartment name</mat-label>
          <input
            #nameInput
            matInput
            placeholder="e.g. Apartment 1 - City center"
            required
          />
        </mat-form-field>

        <mat-form-field appearance="outline" class="apartment-form__field">
          <mat-label>Notes</mat-label>
          <textarea
            #notesInput
            matInput
            rows="4"
            placeholder="Optional notes, address or other details"
          ></textarea>
        </mat-form-field>

        <div class="apartment-form__actions">
          <button
            mat-button
            type="button"
            color="primary"
            (click)="cancel()"
          >
            Cancel
          </button>

          <button mat-flat-button color="primary" type="submit">
            <mat-icon>save</mat-icon>
            <span>Save apartment</span>
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</section>
