<mat-toolbar color="primary" class="app-toolbar">
  <button mat-icon-button class="app-toolbar__logo" routerLink="/overview" aria-label="Go to overview">
    <mat-icon>home</mat-icon>
  </button>

  <span class="app-toolbar__title">
    <!-- Трошоци -->
  </span>

  <nav class="app-toolbar__nav">
    <a mat-button routerLink="/dashboard" routerLinkActive="app-toolbar__link--active">
      <mat-icon>dashboard</mat-icon>
      <span>Dashboard</span>
    </a>
    <a mat-button routerLink="/overview" routerLinkActive="app-toolbar__link--active"
      [routerLinkActiveOptions]="{ exact: true }">
      <mat-icon>view_list</mat-icon>
      <span>Трошоци</span>
    </a>
    <a mat-button routerLink="/overview/new" routerLinkActive="app-toolbar__link--active">
      <mat-icon>add_home</mat-icon>
      <span>Додај ставка</span>
    </a>
    <a mat-button routerLink="/dashboard-dark" routerLinkActive="app-toolbar__link--active">
      <mat-icon>dashboard_2</mat-icon>
      <span>Dashboard (dark)</span>
    </a>
  </nav>

  <span class="app-toolbar__spacer"></span>

  <span class="app-toolbar__total" *ngIf="totalMonthly() as total">
    Вкупно месечно:
    <strong>{{ total | number : '1.0-0' }} MKD</strong>
  </span>
  &nbsp; &nbsp; &nbsp; &nbsp;
  <span class="app-toolbar__total" *ngIf="totalMonthly() as total">
    Вкупно годишно:
    <strong>{{ total * 12 | number : '1.0-0' }} MKD</strong>
  </span>
</mat-toolbar>

<main class="app-shell">
  <section class="app-shell__content">
    <router-outlet></router-outlet>
  </section>
</main>
